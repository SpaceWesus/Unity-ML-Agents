:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);

.form-select:not(:disabled):hover {

}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

  mask: var(--checkmark-image) center / 12px 12px no-repeat;

  border: 2px solid var(--primary);

    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

#widget &gt; svg {

svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;

.text-warning,
.text-destructive {

    &lt;article class=&quot;wiki-article&quot;&gt;
      &lt;header class=&quot;wiki-article-header&quot;&gt;
        &lt;h1&gt;Dungeon generation&lt;/h1&gt;
        &lt;p class=&quot;wiki-origin&quot;&gt;From Turtle Wiki, the authoritative development reference&lt;/p&gt;
        &lt;nav class=&quot;wiki-page-tabs&quot; aria-label=&quot;Article tools&quot;&gt;
          &lt;span class=&quot;wiki-tab-group&quot;&gt;
            &lt;a class=&quot;wiki-tab is-active&quot; href=&quot;#dg-overview&quot;&gt;Article&lt;/a&gt;
            &lt;a class=&quot;wiki-tab&quot; href=&quot;#dg-iteration&quot;&gt;Discussion&lt;/a&gt;
          &lt;/span&gt;
          &lt;span class=&quot;wiki-tab-group&quot;&gt;

          &lt;/span&gt;
        &lt;/nav&gt;
      &lt;/header&gt;

      &lt;aside class=&quot;card wiki-infobox&quot; aria-label=&quot;Dungeon generator facts&quot;&gt;
        &lt;strong class=&quot;wiki-infobox-title&quot;&gt;Dungeon generator&lt;/strong&gt;
        &lt;dl&gt;
          &lt;dt&gt;Method&lt;/dt&gt;&lt;dd&gt;Room-first cardinal graph&lt;/dd&gt;
          &lt;dt&gt;Room count&lt;/dt&gt;&lt;dd&gt;8–12&lt;/dd&gt;
          &lt;dt&gt;Loop ceiling&lt;/dt&gt;&lt;dd&gt;0–2 by default&lt;/dd&gt;
          &lt;dt&gt;Door width&lt;/dt&gt;&lt;dd&gt;4.5 Unity units&lt;/dd&gt;
          &lt;dt&gt;Preview seed&lt;/dt&gt;&lt;dd&gt;&lt;code&gt;731245&lt;/code&gt;&lt;/dd&gt;
          &lt;dt&gt;Templates&lt;/dt&gt;&lt;dd&gt;11&lt;/dd&gt;
          &lt;dt&gt;Scene&lt;/dt&gt;&lt;dd&gt;&lt;code&gt;Demo Dungeon&lt;/code&gt;&lt;/dd&gt;
          &lt;dt&gt;Combat reference&lt;/dt&gt;&lt;dd&gt;&lt;em&gt;Kenshi&lt;/em&gt; with magic&lt;/dd&gt;
          &lt;dt&gt;Dungeon reference&lt;/dt&gt;&lt;dd&gt;&lt;em&gt;Enter the Gungeon&lt;/em&gt;&lt;/dd&gt;
          &lt;dt&gt;Reference state&lt;/dt&gt;&lt;dd&gt;Living document&lt;/dd&gt;
        &lt;/dl&gt;
      &lt;/aside&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-overview&quot;&gt;
        &lt;p class=&quot;wiki-lead&quot;&gt;&lt;strong&gt;The dungeon system builds a connected graph first, then turns that abstract graph into a playable 2D level.&lt;/strong&gt; A seed determines room placement, graph connections, semantic purposes, spatial templates, corridor bends, and the location of the raid fixture. The graph can be simulated without scene objects; the materializer is responsible for Unity floors, walls, colliders, props, spawn markers, and runtime bindings.&lt;/p&gt;

        &lt;div class=&quot;viz-grid&quot;&gt;
          &lt;div class=&quot;card viz-stat&quot;&gt;
            &lt;span class=&quot;text-muted&quot;&gt;Graph guarantee&lt;/span&gt;
            &lt;span class=&quot;viz-stat-value&quot;&gt;100% connected&lt;/span&gt;
            &lt;span class=&quot;text-small&quot;&gt;Every room is reachable from the entrance.&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;card viz-stat&quot;&gt;
            &lt;span class=&quot;text-muted&quot;&gt;Critical path&lt;/span&gt;
            &lt;span class=&quot;viz-stat-value&quot;&gt;Graph diameter&lt;/span&gt;
            &lt;span class=&quot;text-small&quot;&gt;Entrance and boss occupy distant endpoints.&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;card viz-stat&quot;&gt;
            &lt;span class=&quot;text-muted&quot;&gt;Reproduction&lt;/span&gt;
            &lt;span class=&quot;viz-stat-value&quot;&gt;Seeded&lt;/span&gt;
            &lt;span class=&quot;text-small&quot;&gt;The same seed reconstructs the same plan.&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;p&gt;The current implementation is intentionally theme-independent. “Encounter,” “reward,” and “boss” describe what a room does. “Pillar hall,” “ring,” and “ambush cover” describe its physical layout. A future Damp Cave encounter and Ancient Crypt encounter may share the same semantic rules while using different tiles, props, hazards, and silhouettes.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-explorer&quot;&gt;
        &lt;h2&gt;Layout explorer&lt;/h2&gt;
        &lt;p&gt;This structural preview follows the same cardinal growth, spanning-tree, loop, graph-diameter, and semantic assignment rules as the Unity planner. Its browser seed is illustrative rather than byte-for-byte compatible with C# &lt;code&gt;System.Random&lt;/code&gt;.&lt;/p&gt;

        &lt;div class=&quot;viz-controls&quot;&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;dg-seed&quot;&gt;Illustrative seed
            &lt;input class=&quot;form-control&quot; id=&quot;dg-seed&quot; type=&quot;number&quot; value=&quot;731245&quot;&gt;
          &lt;/label&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;dg-room-count&quot;&gt;Room count: &lt;span id=&quot;dg-room-count-value&quot;&gt;11&lt;/span&gt;
            &lt;input class=&quot;form-range&quot; id=&quot;dg-room-count&quot; type=&quot;range&quot; min=&quot;8&quot; max=&quot;12&quot; value=&quot;11&quot;&gt;
          &lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;viz-controls&quot;&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;dg-loop-budget&quot;&gt;Loop ceiling: &lt;span id=&quot;dg-loop-budget-value&quot;&gt;2&lt;/span&gt;
            &lt;input class=&quot;form-range&quot; id=&quot;dg-loop-budget&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;3&quot; value=&quot;2&quot;&gt;
          &lt;/label&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;dg-inspect-room&quot;&gt;Inspect room
            &lt;select class=&quot;form-select&quot; id=&quot;dg-inspect-room&quot;&gt;&lt;/select&gt;
          &lt;/label&gt;
          &lt;button class=&quot;btn btn-primary&quot; id=&quot;dg-generate&quot; type=&quot;button&quot;&gt;Generate schematic&lt;/button&gt;
        &lt;/div&gt;

        &lt;svg class=&quot;wiki-map&quot; id=&quot;dg-map&quot; viewBox=&quot;0 0 760 430&quot; role=&quot;img&quot; aria-labelledby=&quot;dg-map-title dg-map-desc&quot;&gt;
          &lt;title id=&quot;dg-map-title&quot;&gt;Generated dungeon room graph&lt;/title&gt;
          &lt;desc id=&quot;dg-map-desc&quot;&gt;A schematic showing connected rooms, the critical entrance-to-boss route, optional branches, and loop corridors.&lt;/desc&gt;
          &lt;rect class=&quot;map-field&quot; x=&quot;0&quot; y=&quot;0&quot; width=&quot;760&quot; height=&quot;430&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
          &lt;g id=&quot;dg-corridor-layer&quot;&gt;&lt;/g&gt;
          &lt;g id=&quot;dg-room-layer&quot;&gt;&lt;/g&gt;
        &lt;/svg&gt;

        &lt;div class=&quot;wiki-legend text-small&quot; aria-label=&quot;Map legend&quot;&gt;
          &lt;span&gt;&lt;i class=&quot;wiki-swatch critical&quot;&gt;&lt;/i&gt;Critical route&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;wiki-swatch entrance&quot;&gt;&lt;/i&gt;Entrance&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;wiki-swatch branch&quot;&gt;&lt;/i&gt;Optional branch&lt;/span&gt;
          &lt;span&gt;&lt;i class=&quot;wiki-swatch boss&quot;&gt;&lt;/i&gt;Boss&lt;/span&gt;
        &lt;/div&gt;
        &lt;p class=&quot;text-small&quot; id=&quot;dg-selection-summary&quot; aria-live=&quot;polite&quot;&gt;&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-pipeline&quot;&gt;
        &lt;h2&gt;Generation pipeline&lt;/h2&gt;
        &lt;ol class=&quot;wiki-pipeline&quot;&gt;
          &lt;li&gt;&lt;strong&gt;Sanitize settings&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Clamp rooms, spacing, jitter, width, and loop ceiling to safe ranges.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Grow cells&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Start at grid origin and repeatedly claim one unoccupied cardinal neighbor.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Shape rooms&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Assign variable rectangles and up to 2.5 units of positional jitter.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Connect all rooms&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Build a randomized spanning tree, guaranteeing one route to every node.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Add loops&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Select zero to the configured ceiling of adjacent non-tree connections.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Find endpoints&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Use two breadth-first searches to approximate the graph diameter.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Assign meaning&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Mark entrance, boss, antechamber, encounters, and optional side rooms.&lt;/span&gt;&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Materialize&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-small&quot;&gt;Create Unity geometry, route waypoints, sockets, colliders, and raid placement.&lt;/span&gt;&lt;/li&gt;
        &lt;/ol&gt;

        &lt;h3&gt;Why the spanning tree comes before loops&lt;/h3&gt;
        &lt;p&gt;A spanning tree provides the minimum set of connections needed for complete reachability: for &lt;em&gt;N&lt;/em&gt; rooms, it creates exactly &lt;em&gt;N − 1&lt;/em&gt; edges. Loop corridors are then optional additions. This makes connectivity an invariant instead of a lucky result, while still allowing layouts with alternate paths and less backtracking.&lt;/p&gt;

        &lt;h3&gt;Why graph distance chooses the boss&lt;/h3&gt;
        &lt;p&gt;The planner does not choose the geometrically farthest room by raw world coordinates. It chooses a distant endpoint by room-to-room traversal count. This better represents perceived dungeon depth: a boss can feel deep because the party passes through many spaces, even if the folded layout is compact on screen.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-semantics&quot;&gt;
        &lt;h2&gt;Room semantics&lt;/h2&gt;
        &lt;p&gt;Purpose controls gameplay placement and progression. Template controls geometry. Theme controls presentation. Keeping these axes independent prevents visual content from becoming combat code.&lt;/p&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Purpose&lt;/th&gt;&lt;th&gt;How it is selected&lt;/th&gt;&lt;th&gt;Current fixture behavior&lt;/th&gt;&lt;th&gt;Intended expansion&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Entrance&lt;/td&gt;&lt;td&gt;First graph-diameter endpoint&lt;/td&gt;&lt;td&gt;Six-hunter formation socket&lt;/td&gt;&lt;td&gt;Gate portal, briefing, retreat boundary&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Encounter&lt;/td&gt;&lt;td&gt;Critical-path default&lt;/td&gt;&lt;td&gt;Eligible destination for the test goblin pod&lt;/td&gt;&lt;td&gt;Enemy budget, pod composition, hazards&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Transition&lt;/td&gt;&lt;td&gt;Room immediately before boss&lt;/td&gt;&lt;td&gt;Boss antechamber template&lt;/td&gt;&lt;td&gt;Regrouping, lock-in, dialogue, readiness check&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Boss&lt;/td&gt;&lt;td&gt;Second graph-diameter endpoint&lt;/td&gt;&lt;td&gt;Boss and exit sockets&lt;/td&gt;&lt;td&gt;Boss phases, boss chest, gate closure&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Reward&lt;/td&gt;&lt;td&gt;First repeating side-branch role&lt;/td&gt;&lt;td&gt;Reward marker&lt;/td&gt;&lt;td&gt;Chest tables, rarity, traps, ownership&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Resource&lt;/td&gt;&lt;td&gt;Second repeating side-branch role&lt;/td&gt;&lt;td&gt;Resource-shaped room&lt;/td&gt;&lt;td&gt;Mana crystals, extraction time, labor decisions&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Event&lt;/td&gt;&lt;td&gt;Third repeating side-branch role&lt;/td&gt;&lt;td&gt;Crossroads layout&lt;/td&gt;&lt;td&gt;Rescue, shrine, puzzle, survivor, hidden modifier&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-catalogue&quot;&gt;
        &lt;h2&gt;Room catalogue&lt;/h2&gt;
        &lt;div class=&quot;wiki-note&quot;&gt;&lt;strong&gt;Provisional greybox library.&lt;/strong&gt; The current eleven templates prove selection, connectivity, sockets, and runtime materialization, but they are not the intended final room set. Several play too similarly. New mockups will become authored spatial templates after their doorway rules, combat purpose, hazards, and pathing requirements are reviewed.&lt;/div&gt;
        &lt;div class=&quot;wiki-two-column&quot;&gt;
          &lt;div&gt;
            &lt;label class=&quot;form-label&quot; for=&quot;dg-template&quot;&gt;Spatial template
              &lt;select class=&quot;form-select&quot; id=&quot;dg-template&quot;&gt;&lt;/select&gt;
            &lt;/label&gt;
            &lt;svg class=&quot;wiki-room-plan&quot; id=&quot;dg-room-plan&quot; viewBox=&quot;0 0 620 360&quot; role=&quot;img&quot; aria-labelledby=&quot;dg-plan-title dg-plan-desc&quot;&gt;
              &lt;title id=&quot;dg-plan-title&quot;&gt;Selected room template plan&lt;/title&gt;
              &lt;desc id=&quot;dg-plan-desc&quot;&gt;A top-down schematic of the selected room template, including door openings and solid obstacles.&lt;/desc&gt;
              &lt;rect class=&quot;plan-field&quot; x=&quot;0&quot; y=&quot;0&quot; width=&quot;620&quot; height=&quot;360&quot; rx=&quot;8&quot;&gt;&lt;/rect&gt;
              &lt;g id=&quot;dg-plan-theme&quot;&gt;&lt;/g&gt;
              &lt;g id=&quot;dg-plan-room&quot;&gt;&lt;/g&gt;
            &lt;/svg&gt;
          &lt;/div&gt;
          &lt;div&gt;
            &lt;h3 id=&quot;dg-template-name&quot;&gt;Open arena&lt;/h3&gt;
            &lt;dl class=&quot;wiki-detail-list&quot;&gt;
              &lt;dt&gt;Geometry&lt;/dt&gt;&lt;dd id=&quot;dg-template-geometry&quot;&gt;&lt;/dd&gt;
              &lt;dt&gt;Combat effect&lt;/dt&gt;&lt;dd id=&quot;dg-template-combat&quot;&gt;&lt;/dd&gt;
              &lt;dt&gt;AI pressure&lt;/dt&gt;&lt;dd id=&quot;dg-template-ai&quot;&gt;&lt;/dd&gt;
              &lt;dt&gt;Art opportunity&lt;/dt&gt;&lt;dd id=&quot;dg-template-art&quot;&gt;&lt;/dd&gt;
              &lt;dt&gt;Current status&lt;/dt&gt;&lt;dd id=&quot;dg-template-status&quot;&gt;&lt;/dd&gt;
            &lt;/dl&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-corridors&quot;&gt;
        &lt;h2&gt;Corridors and navigation&lt;/h2&gt;
        &lt;p&gt;Every graph edge becomes an orthogonal route. The planner begins at the center of the correct room side, creates one or two axis-aligned bends, and ends at the center of the destination side. The materializer builds floor segments along that route and cuts matching doorway gaps into room walls.&lt;/p&gt;
        &lt;div class=&quot;wiki-note&quot;&gt;&lt;strong&gt;Known playtest defect.&lt;/strong&gt; Many generated connection tiles do not currently have continuous walls. Hunters can leave the navigable floor, become trapped outside the intended level, and fall behind the party. Graph connectivity is valid, but physical containment is not yet reliable.&lt;/div&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Layer&lt;/th&gt;&lt;th&gt;Responsibility&lt;/th&gt;&lt;th&gt;Reason&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Graph connection&lt;/td&gt;&lt;td&gt;Stores room adjacency&lt;/td&gt;&lt;td&gt;Supports abstract simulation and breadth-first route selection&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Ordered waypoints&lt;/td&gt;&lt;td&gt;Represents bends in traversal order&lt;/td&gt;&lt;td&gt;Stops parties from cutting diagonally through walls&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Physical corridor&lt;/td&gt;&lt;td&gt;Creates visible floor and collidable rails&lt;/td&gt;&lt;td&gt;Makes the route spatially meaningful in real-time combat&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Agent steering&lt;/td&gt;&lt;td&gt;Casts ahead and attempts stable left/right detours&lt;/td&gt;&lt;td&gt;Lets shared AI move around solid room cover&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;p class=&quot;text-small&quot;&gt;The avoidance steering is implemented and compiler-validated, but its final autonomous smoke-test rerun remains outstanding. It is local collision avoidance, not a complete navigation mesh or grid-based pathfinder.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-feedback&quot;&gt;
        &lt;h2&gt;Playtest direction&lt;/h2&gt;
        &lt;p&gt;This section records accepted experiential goals separately from proposed technical responses. It is not an implementation authorization.&lt;/p&gt;

        &lt;h3&gt;Accepted experiential direction&lt;/h3&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Area&lt;/th&gt;&lt;th&gt;Direction&lt;/th&gt;&lt;th&gt;What should be avoided&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Party behavior&lt;/td&gt;&lt;td&gt;Hunters behave as individuals whose actions create situations that teammates notice and react to.&lt;/td&gt;&lt;td&gt;Instant formation snapping, perfectly synchronized decisions, and apparent knowledge of actions before they happen.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Combat feel&lt;/td&gt;&lt;td&gt;A busy, grounded &lt;em&gt;Kenshi&lt;/em&gt;-like squad battle with magic, abilities, injuries, rescues, and role-driven choices layered into the melee.&lt;/td&gt;&lt;td&gt;A single group brain moving six bodies as one unit or a rigid rotation in which every action is pre-coordinated.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Dungeon feel&lt;/td&gt;&lt;td&gt;&lt;em&gt;Enter the Gungeon&lt;/em&gt;-like variety: recognizable room silhouettes, authored tactical ideas, distinct tilesets, hazards, secrets, and memorable spatial landmarks inside a procedural run.&lt;/td&gt;&lt;td&gt;Rooms that differ only by moving a few blockers or recoloring the same combat rectangle.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Generation strategy&lt;/td&gt;&lt;td&gt;Use procedural structure to arrange and contextualize strong authored room templates.&lt;/td&gt;&lt;td&gt;Unconstrained random geometry that produces nominal variety without meaningful gameplay differences.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;

        &lt;h3&gt;Proposed connection-tile contract&lt;/h3&gt;
        &lt;ul&gt;
          &lt;li&gt;Every visible corridor floor edge has a continuous matching wall or collider, except at an intentional doorway or authored opening.&lt;/li&gt;
          &lt;li&gt;Straight, corner, T-junction, and cross-junction pieces share compatible doorway width, wall thickness, and collider overlap rules.&lt;/li&gt;
          &lt;li&gt;Corridor endpoints overlap the destination room threshold far enough that neither rendering seams nor collision gaps can appear.&lt;/li&gt;
          &lt;li&gt;Generated navigable bounds are queryable, allowing validation to detect any active hunter outside the legal level footprint.&lt;/li&gt;
          &lt;li&gt;A hunter may fall behind because of injury, fear, combat, or a personal decision—not because the geometry leaked them out of the dungeon.&lt;/li&gt;
        &lt;/ul&gt;

        &lt;h3&gt;Proposed individual-agent model&lt;/h3&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Layer&lt;/th&gt;&lt;th&gt;Owned by each hunter&lt;/th&gt;&lt;th&gt;Resulting behavior&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Perception&lt;/td&gt;&lt;td&gt;Visible threats, recent sounds, remembered targets, observed ally states, and communicated information.&lt;/td&gt;&lt;td&gt;Agents react to what they plausibly know instead of reading shared omniscient state.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Intent&lt;/td&gt;&lt;td&gt;Current goal, urgency, confidence, risk tolerance, role preference, and personal relationships.&lt;/td&gt;&lt;td&gt;Two hunters can interpret the same fight differently without becoming irrational.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Action commitment&lt;/td&gt;&lt;td&gt;Chosen attack, spell, rescue, reposition, dodge, retreat, or regroup action.&lt;/td&gt;&lt;td&gt;Teammates can observe and respond after commitment or telegraphing rather than predicting it for free.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Coordination&lt;/td&gt;&lt;td&gt;Leadership influence, shouted orders, formation preference, and local cohesion pressure.&lt;/td&gt;&lt;td&gt;Travel formation remains useful but soft; it can form gradually, bend around obstacles, and dissolve naturally on contact.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Reaction timing&lt;/td&gt;&lt;td&gt;Awareness, ability, personality, latency, and current workload.&lt;/td&gt;&lt;td&gt;Responses are staggered and readable instead of six simultaneous state changes.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;

        &lt;h3&gt;Room distinctiveness rubric&lt;/h3&gt;
        &lt;p&gt;A proposed room should differ meaningfully from existing rooms in at least three of the following dimensions before it enters the production catalogue.&lt;/p&gt;
        &lt;ul&gt;
          &lt;li&gt;&lt;strong&gt;Silhouette and topology:&lt;/strong&gt; shape, entrances, loops, internal lanes, elevation analogue, or subspaces.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Combat question:&lt;/strong&gt; what decision the room repeatedly asks of melee, ranged, support, and mobility roles.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Cover and sight lines:&lt;/strong&gt; how vision, projectiles, flanking, area effects, and retreats are changed.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Hazards and interaction:&lt;/strong&gt; traps, destructibles, movable cover, terrain effects, secrets, or objectives.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Encounter grammar:&lt;/strong&gt; spawn pockets, reinforcement routes, boss mechanics, civilian presence, or ambush logic.&lt;/li&gt;
          &lt;li&gt;&lt;strong&gt;Theme identity:&lt;/strong&gt; landmark, material language, lighting, props, and readable environmental story.&lt;/li&gt;
        &lt;/ul&gt;
        &lt;div class=&quot;wiki-note&quot;&gt;&lt;strong&gt;Reference-image hold.&lt;/strong&gt; Final replacement room layouts are intentionally deferred until the supplied mock images can be assessed against doorway compatibility, traversal safety, combat purpose, agent pathing, and abstract-simulation needs.&lt;/div&gt;

        &lt;h3&gt;Proposed acceptance checks&lt;/h3&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Concern&lt;/th&gt;&lt;th&gt;Acceptance evidence&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Connection containment&lt;/td&gt;&lt;td&gt;Automated geometry validation finds no unbounded floor edge or doorway mismatch across a broad deterministic seed set.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Whole-party traversal&lt;/td&gt;&lt;td&gt;All six active hunters reach successive objectives across repeated seeded raids; no healthy hunter exits navigable bounds or remains more than one cleared room behind without an authored reason.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Room variety&lt;/td&gt;&lt;td&gt;Each accepted template has a named tactical purpose and satisfies at least three distinctiveness dimensions.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Agent individuality&lt;/td&gt;&lt;td&gt;Repeated runs produce plausible differences in approach, target choice, spacing, reaction timing, rescue behavior, and retreat decisions without breaking party goals.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Coordination integrity&lt;/td&gt;&lt;td&gt;Agents can cooperate through perception and communication while remaining unable to know an ally&#x27;s private future action.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-art&quot;&gt;
        &lt;h2&gt;Art direction workbench&lt;/h2&gt;
        &lt;p&gt;The current level is a readable greybox. Theme selection below changes the visual design brief for the room plan; it does not imply that themed tiles or procedural dressing are already implemented in Unity.&lt;/p&gt;
        &lt;div class=&quot;viz-controls&quot;&gt;
          &lt;label class=&quot;form-label&quot; for=&quot;dg-theme&quot;&gt;Dungeon theme
            &lt;select class=&quot;form-select&quot; id=&quot;dg-theme&quot;&gt;
              &lt;option value=&quot;damp&quot;&gt;Damp cave&lt;/option&gt;
              &lt;option value=&quot;crypt&quot;&gt;Ancient crypt&lt;/option&gt;
              &lt;option value=&quot;temple&quot;&gt;Ruined temple&lt;/option&gt;
              &lt;option value=&quot;frozen&quot;&gt;Frozen cavern&lt;/option&gt;
            &lt;/select&gt;
          &lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;th&gt;Primary silhouette&lt;/th&gt;&lt;td id=&quot;dg-theme-silhouette&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;th&gt;Floor language&lt;/th&gt;&lt;td id=&quot;dg-theme-floor&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;th&gt;Walls and boundaries&lt;/th&gt;&lt;td id=&quot;dg-theme-walls&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;th&gt;Landmarks&lt;/th&gt;&lt;td id=&quot;dg-theme-landmarks&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;th&gt;Readability rule&lt;/th&gt;&lt;td id=&quot;dg-theme-rule&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;th&gt;Possible mechanics&lt;/th&gt;&lt;td id=&quot;dg-theme-mechanics&quot;&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;div class=&quot;wiki-status-line&quot;&gt;
          &lt;button class=&quot;btn btn-primary&quot; id=&quot;dg-discuss&quot; type=&quot;button&quot;&gt;Copy selected change brief&lt;/button&gt;
          &lt;span class=&quot;text-small text-muted&quot; id=&quot;dg-discuss-status&quot; aria-live=&quot;polite&quot;&gt;&lt;/span&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-iteration&quot;&gt;
        &lt;h2&gt;Iteration workflow&lt;/h2&gt;
        &lt;p&gt;This page works best as a living design contract. Changes should move from a proposed player-facing outcome to an accepted design, then to implementation and verification. The wiki should explain the intended behavior before the Unity project is altered.&lt;/p&gt;

        &lt;div class=&quot;wiki-state-key&quot; aria-label=&quot;Design states&quot;&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Current&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Proposed&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Accepted&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Implemented&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Verified&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;Deferred&lt;/span&gt;
        &lt;/div&gt;

        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Step&lt;/th&gt;&lt;th&gt;Your input&lt;/th&gt;&lt;th&gt;Wiki update&lt;/th&gt;&lt;th&gt;Unity work&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;1. Focus&lt;/td&gt;&lt;td&gt;Name one system, room family, theme, or player experience.&lt;/td&gt;&lt;td&gt;The affected article section is identified.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;2. Intent&lt;/td&gt;&lt;td&gt;Describe what should feel different and any non-negotiable constraints.&lt;/td&gt;&lt;td&gt;Current behavior, proposed behavior, tradeoffs, and open questions are documented.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;3. Review&lt;/td&gt;&lt;td&gt;Mark each proposal &lt;strong&gt;approve&lt;/strong&gt;, &lt;strong&gt;revise&lt;/strong&gt;, or &lt;strong&gt;defer&lt;/strong&gt;.&lt;/td&gt;&lt;td&gt;Accepted decisions and rejected alternatives are recorded.&lt;/td&gt;&lt;td&gt;None.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;4. Build&lt;/td&gt;&lt;td&gt;Say &lt;strong&gt;implement the accepted change set&lt;/strong&gt;.&lt;/td&gt;&lt;td&gt;Status moves from Accepted to Implemented.&lt;/td&gt;&lt;td&gt;The smallest coherent production change is made.&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;5. Verify&lt;/td&gt;&lt;td&gt;Play the test and report observable problems.&lt;/td&gt;&lt;td&gt;Acceptance results and remaining risks are recorded.&lt;/td&gt;&lt;td&gt;Tests, smoke checks, and focused corrections are completed.&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;

        &lt;div class=&quot;wiki-edit-box&quot;&gt;
          &lt;h3&gt;Recommended change request&lt;/h3&gt;
          &lt;pre&gt;&lt;code&gt;Wiki update: Dungeon generation / [section]
Desired experience: [what the player should feel or notice]
Keep: [parts of the current design that already work]
Change: [specific behavior, art language, or rule]
Constraints: [performance, production, AI, persistence, or scope]
Decision requested: [options you want compared, or a direct proposal]&lt;/code&gt;&lt;/pre&gt;
          &lt;p class=&quot;text-small&quot;&gt;For visual direction, references or rough sketches are welcome. For systemic changes, describe one example dungeon run from entrance to boss. Concrete examples expose hidden assumptions faster than isolated feature lists.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-lifecycle&quot;&gt;
        &lt;h2&gt;Seeds, lifecycle, and persistence&lt;/h2&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Context&lt;/th&gt;&lt;th&gt;Seed source&lt;/th&gt;&lt;th&gt;Expected behavior&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Saved editor preview&lt;/td&gt;&lt;td&gt;&lt;code&gt;731245&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Visible outside Play Mode and regenerated by the setup tool&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Standalone Demo Play Mode&lt;/td&gt;&lt;td&gt;Fresh runtime seed&lt;/td&gt;&lt;td&gt;Produces a new testing layout each run&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Campaign gate&lt;/td&gt;&lt;td&gt;&lt;code&gt;GateInstanceState.mapSeed&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Reconstructs the same dungeon after save, reload, or observation transition&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;

        &lt;h3&gt;What should be persisted&lt;/h3&gt;
        &lt;p&gt;&lt;strong&gt;Static structure&lt;/strong&gt; should be reproducible from a map seed, generator version, and content definitions. &lt;strong&gt;Sparse mutations&lt;/strong&gt; should be saved separately: opened chests, depleted resources, defeated pods, triggered traps, destroyed props, discovered secrets, and exact participant state.&lt;/p&gt;

        &lt;h3&gt;Rendered and abstract raids&lt;/h3&gt;
        &lt;p&gt;The plain layout plan owns no scene objects. That boundary is important for the game vision: an off-screen raid can reason about a room graph, encounter ordering, and resource locations without rendering floors or colliders. When observed, the same seed and encounter state can materialize a playable dungeon view.&lt;/p&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section&quot; id=&quot;dg-status&quot;&gt;
        &lt;h2&gt;Implementation status&lt;/h2&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Feature&lt;/th&gt;&lt;th&gt;Status&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;Deterministic room graph&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Implemented&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Same-seed structural validation passes&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;8–12 varied rooms&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Implemented&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Variable rectangles, jitter, templates, branches, and loops&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Visible editor preview&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Implemented&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Eleven-room seed 731245 preview is serialized in the scene&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Bent corridor traversal&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Implemented&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Connections store ordered waypoints in both directions&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Connection tile wall continuity&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Known defect&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Missing walls can let hunters leave the level and become stranded&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Solid-cover avoidance&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Verification pending&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Compiler passes; autonomous Play Mode rerun remains&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Individual hunter combat autonomy&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Direction accepted&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Per-agent perception, intent, commitment, communication, and reaction timing are not yet implemented&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Production room template library&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Awaiting references&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Current greyboxes remain provisional until mock images are reviewed&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Theme tile sets&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Design only&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Theme art direction is not yet a data-driven Unity asset&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Full encounter population&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Future&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Current fixture relocates one six-goblin pod into a deep encounter&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Boss generation&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Future&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Boss room and socket exist; boss content generation does not&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Secrets, locks, and puzzles&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Future&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Not represented in the current graph grammar&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;Generator-version migration&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;viz-badge&quot;&gt;Future&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Needed before released saves must reproduce legacy algorithms&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;wiki-section wiki-code-map&quot; id=&quot;dg-code&quot;&gt;
        &lt;h2&gt;Code map&lt;/h2&gt;
        &lt;div class=&quot;table-responsive&quot;&gt;
          &lt;table class=&quot;table table-sm&quot;&gt;
            &lt;thead&gt;&lt;tr&gt;&lt;th&gt;Type&lt;/th&gt;&lt;th&gt;Authority&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
            &lt;tbody&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;DungeonRoomFirstPlanner2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Pure deterministic graph and layout planning&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;DungeonRoomFirstPlan2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Rooms, purposes, templates, connections, and corridor waypoints&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;DungeonRoomFirstGenerator2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Unity scene materialization and raid-fixture placement&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;RaidRoom2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Room bounds, identity, sequence, and semantic purpose&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;RaidRoomConnection2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Adjacency plus ordered traversal waypoints&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;RaidSpawnMarker2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Theme-independent content sockets&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;DungeonRaidDirector2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Room-graph routing and real-time raid orchestration&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;RaidAgent2D&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Physics movement, collision avoidance, combat state, and presentation&lt;/td&gt;&lt;/tr&gt;
              &lt;tr&gt;&lt;td&gt;&lt;code&gt;DemoDungeonRaidBuilder&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Saved preview setup and structural validation&lt;/td&gt;&lt;/tr&gt;
            &lt;/tbody&gt;
          &lt;/table&gt;
        &lt;/div&gt;
        &lt;p class=&quot;wiki-footnote text-small text-muted&quot;&gt;Article scope: the current 2D Demo Dungeon implementation and its intended integration boundary. Theme-specific art, content budgets, gate modifiers, and full campaign persistence remain design surfaces rather than completed systems.&lt;/p&gt;
      &lt;/section&gt;
    &lt;/article&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;turtle-dungeon-wiki&#x27;);
      const seedInput = root.querySelector(&#x27;#dg-seed&#x27;);
      const roomRange = root.querySelector(&#x27;#dg-room-count&#x27;);
      const roomValue = root.querySelector(&#x27;#dg-room-count-value&#x27;);
      const loopRange = root.querySelector(&#x27;#dg-loop-budget&#x27;);
      const loopValue = root.querySelector(&#x27;#dg-loop-budget-value&#x27;);
      const inspectSelect = root.querySelector(&#x27;#dg-inspect-room&#x27;);
      const generateButton = root.querySelector(&#x27;#dg-generate&#x27;);
      const corridorLayer = root.querySelector(&#x27;#dg-corridor-layer&#x27;);
      const roomLayer = root.querySelector(&#x27;#dg-room-layer&#x27;);
      const selectionSummary = root.querySelector(&#x27;#dg-selection-summary&#x27;);
      const templateSelect = root.querySelector(&#x27;#dg-template&#x27;);
      const themeSelect = root.querySelector(&#x27;#dg-theme&#x27;);
      const planTheme = root.querySelector(&#x27;#dg-plan-theme&#x27;);
      const planRoom = root.querySelector(&#x27;#dg-plan-room&#x27;);
      const discussButton = root.querySelector(&#x27;#dg-discuss&#x27;);
      const discussStatus = root.querySelector(&#x27;#dg-discuss-status&#x27;);
      const searchForm = root.querySelector(&#x27;#dg-search-form&#x27;);
      const searchInput = root.querySelector(&#x27;#dg-search-input&#x27;);
      let currentPlan = null;
      let selectedRoomId = 0;
