      function mulberry32(seed) {
        let value = seed &gt;&gt;&gt; 0;
        return () =&gt; {
          value += 0x6D2B79F5;
          let t = value;
          t = Math.imul(t ^ (t &gt;&gt;&gt; 15), t | 1);
          t ^= t + Math.imul(t ^ (t &gt;&gt;&gt; 7), t | 61);
          return ((t ^ (t &gt;&gt;&gt; 14)) &gt;&gt;&gt; 0) / 4294967296;
        };
      }

      function randInt(random, minimum, maximum) {
        return minimum + Math.floor(random() * (maximum - minimum + 1));
      }

      function randomEven(random, minimum, maximum) {
        const value = randInt(random, minimum, maximum);
        return value % 2 === 0 ? value : value + 1;
      }

      function key(x, y) { return `${x},${y}`; }
      function edgeKey(a, b) { return a &lt; b ? `${a}-${b}` : `${b}-${a}`; }

      function buildAdjacency(roomCount, edges) {
        const adjacency = Array.from({ length: roomCount }, () =&gt; []);
        edges.forEach(edge =&gt; {
          adjacency[edge.a].push(edge.b);
          adjacency[edge.b].push(edge.a);
        });
        adjacency.forEach(neighbors =&gt; neighbors.sort((a, b) =&gt; a - b));
        return adjacency;
      }

      function distancesFrom(start, adjacency) {
        const distances = new Map([[start, 0]]);
        const queue = [start];
        for (let index = 0; index &lt; queue.length; index++) {
          const current = queue[index];
          adjacency[current].forEach(neighbor =&gt; {
            if (distances.has(neighbor)) return;
            distances.set(neighbor, distances.get(current) + 1);
            queue.push(neighbor);
          });
        }
        return distances;
      }

      function farthestFrom(start, adjacency) {
        return [...distancesFrom(start, adjacency).entries()]
          .sort((left, right) =&gt; right[1] - left[1] || left[0] - right[0])[0][0];
      }

      function findPath(start, destination, adjacency) {
        const previous = new Map();
        const visited = new Set([start]);
        const queue = [start];
        for (let index = 0; index &lt; queue.length; index++) {
          const current = queue[index];
          if (current === destination) break;
          adjacency[current].forEach(neighbor =&gt; {
            if (visited.has(neighbor)) return;
            visited.add(neighbor);
            previous.set(neighbor, current);
            queue.push(neighbor);
          });
        }
        const path = [destination];
        while (path[path.length - 1] !== start) path.push(previous.get(path[path.length - 1]));
        return path.reverse();
      }

      function generatePlan(seed, targetCount, maximumLoops) {
        const random = mulberry32(seed);
        const cells = [{ x: 0, y: 0 }];
        const occupied = new Set([key(0, 0)]);
        while (cells.length &lt; targetCount) {
          const candidateMap = new Map();
          cells.forEach(cell =&gt; directions.forEach(direction =&gt; {
            const candidate = { x: cell.x + direction[0], y: cell.y + direction[1] };
            const candidateKey = key(candidate.x, candidate.y);
            if (!occupied.has(candidateKey)) candidateMap.set(candidateKey, candidate);
          }));
          const candidates = [...candidateMap.values()].sort((a, b) =&gt;
            (Math.abs(a.x) + Math.abs(a.y)) - (Math.abs(b.x) + Math.abs(b.y)) || a.x - b.x || a.y - b.y);
          const picked = candidates[randInt(random, 0, candidates.length - 1)];
          occupied.add(key(picked.x, picked.y));
          cells.push(picked);
        }

        const rooms = cells.map((cell, id) =&gt; ({
          id, cell, x: cell.x * 29 + (random() * 5 - 2.5), y: cell.y * 23 + (random() * 5 - 2.5),
          width: randomEven(random, 15, 23), height: randomEven(random, 13, 19),
          sequence: 0, purpose: &#x27;Encounter&#x27;, template: encounterTemplates[randInt(random, 0, encounterTemplates.length - 1)]
        }));
        const byCell = new Map(rooms.map(room =&gt; [key(room.cell.x, room.cell.y), room.id]));
        const connected = new Set([0]);
        const edges = [];
        const usedEdges = new Set();
        while (connected.size &lt; rooms.length) {
          const candidates = [];
          [...connected].sort((a, b) =&gt; a - b).forEach(roomId =&gt; {
            const cell = rooms[roomId].cell;
            directions.forEach(direction =&gt; {
              const neighbor = byCell.get(key(cell.x + direction[0], cell.y + direction[1]));
              if (neighbor === undefined || connected.has(neighbor)) return;
              candidates.push({ a: Math.min(roomId, neighbor), b: Math.max(roomId, neighbor) });
            });
          });
          const picked = candidates[randInt(random, 0, candidates.length - 1)];
          const pickedKey = edgeKey(picked.a, picked.b);
          if (!usedEdges.has(pickedKey)) {
            edges.push(picked);
            usedEdges.add(pickedKey);
          }
          connected.add(connected.has(picked.a) ? picked.b : picked.a);
        }

        const loopCandidates = [];
        rooms.forEach(room =&gt; directions.slice(0, 2).forEach(direction =&gt; {
          const neighbor = byCell.get(key(room.cell.x + direction[0], room.cell.y + direction[1]));
          if (neighbor === undefined) return;
          const candidate = { a: Math.min(room.id, neighbor), b: Math.max(room.id, neighbor) };
          if (!usedEdges.has(edgeKey(candidate.a, candidate.b))) loopCandidates.push(candidate);
        }));
        const loopCount = loopCandidates.length === 0 ? 0 : randInt(random, 0, Math.min(maximumLoops, loopCandidates.length));
        for (let index = 0; index &lt; loopCount; index++) {
          const pickedIndex = randInt(random, 0, loopCandidates.length - 1);
          const picked = loopCandidates.splice(pickedIndex, 1)[0];
          edges.push(picked);
          usedEdges.add(edgeKey(picked.a, picked.b));
        }

        const adjacency = buildAdjacency(rooms.length, edges);
        const entrance = farthestFrom(0, adjacency);
        const boss = farthestFrom(entrance, adjacency);
        const criticalPath = findPath(entrance, boss, adjacency);
        const pathSet = new Set(criticalPath);
        const distanceMap = distancesFrom(entrance, adjacency);
        rooms.forEach(room =&gt; room.sequence = distanceMap.get(room.id));
        rooms[entrance].purpose = &#x27;Entrance&#x27;;
        rooms[entrance].template = &#x27;OpenArena&#x27;;
        rooms[entrance].width = 19; rooms[entrance].height = 16;
        rooms[boss].purpose = &#x27;Boss&#x27;;
        rooms[boss].template = random() &lt; 0.5 ? &#x27;BossPillars&#x27; : &#x27;BossOpen&#x27;;
        rooms[boss].width = 28; rooms[boss].height = 23;
        if (criticalPath.length &gt;= 3) {
          const transition = rooms[criticalPath[criticalPath.length - 2]];
          transition.purpose = &#x27;Transition&#x27;; transition.template = &#x27;BossAntechamber&#x27;;
          transition.width = 15; transition.height = 13;
        }
        let branchIndex = 0;
        rooms.filter(room =&gt; !pathSet.has(room.id)).sort((a, b) =&gt; a.id - b.id).forEach(room =&gt; {
          const role = branchIndex++ % 3;
          if (role === 0) { room.purpose = &#x27;Reward&#x27;; room.template = &#x27;RewardCache&#x27;; }
          else if (role === 1) { room.purpose = &#x27;Resource&#x27;; room.template = &#x27;ResourcePocket&#x27;; }
          else { room.purpose = &#x27;Event&#x27;; room.template = &#x27;Crossroads&#x27;; }
        });
        const offsetX = rooms[entrance].x;
        const offsetY = rooms[entrance].y;
        rooms.forEach(room =&gt; { room.x -= offsetX; room.y -= offsetY; });
        edges.forEach(edge =&gt; {
          const from = rooms[edge.a];
          const to = rooms[edge.b];
          const horizontal = Math.abs(to.x - from.x) &gt;= Math.abs(to.y - from.y);
          const alternate = random() &lt; 0.5;
          if (horizontal) {
            const sign = Math.sign(to.x - from.x) || 1;
            const start = { x: from.x + sign * from.width / 2, y: from.y };
            const end = { x: to.x - sign * to.width / 2, y: to.y };
            const bend = start.x + (end.x - start.x) * (alternate ? 0.35 : 0.65);
            edge.points = [start, { x: bend, y: start.y }, { x: bend, y: end.y }, end];
          } else {
            const sign = Math.sign(to.y - from.y) || 1;
            const start = { x: from.x, y: from.y + sign * from.height / 2 };
            const end = { x: to.x, y: to.y - sign * to.height / 2 };
            const bend = start.y + (end.y - start.y) * (alternate ? 0.35 : 0.65);
            edge.points = [start, { x: start.x, y: bend }, { x: end.x, y: bend }, end];
          }
        });
        const criticalEdges = new Set();
        for (let index = 0; index &lt; criticalPath.length - 1; index++) criticalEdges.add(edgeKey(criticalPath[index], criticalPath[index + 1]));
        return { seed, rooms, edges, entrance, boss, criticalPath, criticalEdges, loopCount };
      }

      function renderPlan() {
        const seed = Number.parseInt(seedInput.value, 10) || 0;
        const roomCount = Number.parseInt(roomRange.value, 10);
        const loopBudget = Number.parseInt(loopRange.value, 10);
        roomValue.textContent = String(roomCount);
        loopValue.textContent = String(loopBudget);
        currentPlan = generatePlan(seed, roomCount, loopBudget);
        if (!currentPlan.rooms.some(room =&gt; room.id === selectedRoomId)) selectedRoomId = currentPlan.entrance;

        const minX = Math.min(...currentPlan.rooms.map(room =&gt; room.x - room.width / 2));
        const maxX = Math.max(...currentPlan.rooms.map(room =&gt; room.x + room.width / 2));
        const minY = Math.min(...currentPlan.rooms.map(room =&gt; room.y - room.height / 2));
        const maxY = Math.max(...currentPlan.rooms.map(room =&gt; room.y + room.height / 2));
        const scale = Math.min(680 / Math.max(1, maxX - minX), 350 / Math.max(1, maxY - minY));
        const project = point =&gt; ({ x: 40 + (point.x - minX) * scale, y: 390 - (point.y - minY) * scale });

        corridorLayer.innerHTML = currentPlan.edges.map(edge =&gt; {
          const points = edge.points.map(point =&gt; {
            const projected = project(point);
            return `${projected.x.toFixed(1)},${projected.y.toFixed(1)}`;
          }).join(&#x27; &#x27;);
          const critical = currentPlan.criticalEdges.has(edgeKey(edge.a, edge.b));
          return `&lt;polyline class=&quot;corridor${critical ? &#x27; corridor-critical&#x27; : &#x27;&#x27;}&quot; points=&quot;${points}&quot;&gt;&lt;/polyline&gt;`;
        }).join(&#x27;&#x27;);

        roomLayer.innerHTML = currentPlan.rooms.map(room =&gt; {
          const center = project(room);
          const width = Math.max(45, room.width * scale);
          const height = Math.max(36, room.height * scale);
          const selected = room.id === selectedRoomId ? &#x27; room-selected&#x27; : &#x27;&#x27;;
          return `&lt;g data-room-id=&quot;${room.id}&quot;&gt;
            &lt;rect class=&quot;room-shape room-${room.purpose.toLowerCase()}${selected}&quot; x=&quot;${(center.x - width / 2).toFixed(1)}&quot; y=&quot;${(center.y - height / 2).toFixed(1)}&quot; width=&quot;${width.toFixed(1)}&quot; height=&quot;${height.toFixed(1)}&quot; rx=&quot;5&quot;&gt;&lt;/rect&gt;
            &lt;text x=&quot;${center.x.toFixed(1)}&quot; y=&quot;${(center.y - 6).toFixed(1)}&quot;&gt;${purposeShort[room.purpose]}&lt;/text&gt;
            &lt;text class=&quot;room-subtext&quot; x=&quot;${center.x.toFixed(1)}&quot; y=&quot;${(center.y + 10).toFixed(1)}&quot;&gt;#${room.id} · d${room.sequence}&lt;/text&gt;
          &lt;/g&gt;`;
        }).join(&#x27;&#x27;);

        inspectSelect.innerHTML = currentPlan.rooms
          .slice().sort((a, b) =&gt; a.sequence - b.sequence || a.id - b.id)
          .map(room =&gt; `&lt;option value=&quot;${room.id}&quot;${room.id === selectedRoomId ? &#x27; selected&#x27; : &#x27;&#x27;}&gt;#${room.id} — ${room.purpose} / ${templateData[room.template].name}&lt;/option&gt;`).join(&#x27;&#x27;);
        updateRoomSelection();
      }

      function updateRoomSelection() {
        if (!currentPlan) return;
        selectedRoomId = Number.parseInt(inspectSelect.value || selectedRoomId, 10);
        const room = currentPlan.rooms.find(candidate =&gt; candidate.id === selectedRoomId) || currentPlan.rooms[0];
        roomLayer.querySelectorAll(&#x27;.room-shape&#x27;).forEach(shape =&gt; shape.classList.remove(&#x27;room-selected&#x27;));
        const selectedShape = roomLayer.querySelector(`[data-room-id=&quot;${room.id}&quot;] .room-shape`);
        if (selectedShape) selectedShape.classList.add(&#x27;room-selected&#x27;);
        selectionSummary.textContent = `Room #${room.id}: ${room.purpose}, ${templateData[room.template].name}, sequence distance ${room.sequence}, approximately ${room.width} × ${room.height} units. Generated loops: ${currentPlan.loopCount}.`;
        templateSelect.value = room.template;
        renderTemplate();
      }

      function renderTemplate() {
        const selected = templateData[templateSelect.value];
        root.querySelector(&#x27;#dg-template-name&#x27;).textContent = selected.name;
        root.querySelector(&#x27;#dg-template-geometry&#x27;).textContent = selected.geometry;
        root.querySelector(&#x27;#dg-template-combat&#x27;).textContent = selected.combat;
        root.querySelector(&#x27;#dg-template-ai&#x27;).textContent = selected.ai;
        root.querySelector(&#x27;#dg-template-art&#x27;).textContent = selected.art;
        root.querySelector(&#x27;#dg-template-status&#x27;).textContent = selected.status;

        const roomX = 95, roomY = 55, roomWidth = 430, roomHeight = 250;
        const gap = 46;
        planRoom.innerHTML = `
          &lt;rect class=&quot;room-floor&quot; x=&quot;${roomX}&quot; y=&quot;${roomY}&quot; width=&quot;${roomWidth}&quot; height=&quot;${roomHeight}&quot; rx=&quot;5&quot;&gt;&lt;/rect&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX}&quot; y1=&quot;${roomY}&quot; x2=&quot;${roomX + roomWidth / 2 - gap / 2}&quot; y2=&quot;${roomY}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX + roomWidth / 2 + gap / 2}&quot; y1=&quot;${roomY}&quot; x2=&quot;${roomX + roomWidth}&quot; y2=&quot;${roomY}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX}&quot; y1=&quot;${roomY + roomHeight}&quot; x2=&quot;${roomX + roomWidth / 2 - gap / 2}&quot; y2=&quot;${roomY + roomHeight}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX + roomWidth / 2 + gap / 2}&quot; y1=&quot;${roomY + roomHeight}&quot; x2=&quot;${roomX + roomWidth}&quot; y2=&quot;${roomY + roomHeight}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX}&quot; y1=&quot;${roomY}&quot; x2=&quot;${roomX}&quot; y2=&quot;${roomY + roomHeight / 2 - gap / 2}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX}&quot; y1=&quot;${roomY + roomHeight / 2 + gap / 2}&quot; x2=&quot;${roomX}&quot; y2=&quot;${roomY + roomHeight}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX + roomWidth}&quot; y1=&quot;${roomY}&quot; x2=&quot;${roomX + roomWidth}&quot; y2=&quot;${roomY + roomHeight / 2 - gap / 2}&quot;&gt;&lt;/line&gt;
          &lt;line class=&quot;room-wall&quot; x1=&quot;${roomX + roomWidth}&quot; y1=&quot;${roomY + roomHeight / 2 + gap / 2}&quot; x2=&quot;${roomX + roomWidth}&quot; y2=&quot;${roomY + roomHeight}&quot;&gt;&lt;/line&gt;
          ${selected.obstacles.map(obstacle =&gt; {
            const width = obstacle[2] * roomWidth;
            const height = obstacle[3] * roomHeight;
            const x = roomX + roomWidth / 2 + obstacle[0] * roomWidth - width / 2;
            const y = roomY + roomHeight / 2 + obstacle[1] * roomHeight - height / 2;
            return `&lt;rect class=&quot;room-obstacle&quot; x=&quot;${x.toFixed(1)}&quot; y=&quot;${y.toFixed(1)}&quot; width=&quot;${width.toFixed(1)}&quot; height=&quot;${height.toFixed(1)}&quot; rx=&quot;3&quot;&gt;&lt;/rect&gt;`;
          }).join(&#x27;&#x27;)}
          &lt;text x=&quot;310&quot; y=&quot;334&quot;&gt;${selected.name}&lt;/text&gt;`;
        renderThemeMarks();
      }

      function renderThemeMarks() {
        const theme = themeSelect.value;
        root.dataset.theme = theme;
        if (theme === &#x27;damp&#x27;) {
          planTheme.innerHTML = &#x27;&lt;ellipse class=&quot;theme-mark&quot; cx=&quot;185&quot; cy=&quot;125&quot; rx=&quot;42&quot; ry=&quot;19&quot;&gt;&lt;/ellipse&gt;&lt;circle class=&quot;theme-mark&quot; cx=&quot;455&quot; cy=&quot;245&quot; r=&quot;17&quot;&gt;&lt;/circle&gt;&lt;circle class=&quot;theme-mark&quot; cx=&quot;420&quot; cy=&quot;105&quot; r=&quot;9&quot;&gt;&lt;/circle&gt;&#x27;;
        } else if (theme === &#x27;crypt&#x27;) {
          planTheme.innerHTML = &#x27;&lt;rect class=&quot;theme-mark&quot; x=&quot;135&quot; y=&quot;92&quot; width=&quot;55&quot; height=&quot;25&quot;&gt;&lt;/rect&gt;&lt;rect class=&quot;theme-mark&quot; x=&quot;430&quot; y=&quot;240&quot; width=&quot;55&quot; height=&quot;25&quot;&gt;&lt;/rect&gt;&lt;path class=&quot;theme-mark&quot; d=&quot;M260 75h100v22H260z&quot;&gt;&lt;/path&gt;&#x27;;
        } else if (theme === &#x27;temple&#x27;) {
          planTheme.innerHTML = &#x27;&lt;circle class=&quot;theme-mark&quot; cx=&quot;310&quot; cy=&quot;180&quot; r=&quot;48&quot;&gt;&lt;/circle&gt;&lt;path class=&quot;theme-mark&quot; d=&quot;M140 250l42-42 42 42z&quot;&gt;&lt;/path&gt;&lt;path class=&quot;theme-mark&quot; d=&quot;M400 110l42-42 42 42z&quot;&gt;&lt;/path&gt;&#x27;;
        } else {
          planTheme.innerHTML = &#x27;&lt;path class=&quot;theme-mark&quot; d=&quot;M150 120l24-36 24 36-24 36z&quot;&gt;&lt;/path&gt;&lt;path class=&quot;theme-mark&quot; d=&quot;M440 230l32-48 32 48-32 48z&quot;&gt;&lt;/path&gt;&lt;path class=&quot;theme-mark&quot; d=&quot;M345 95l15-24 15 24-15 24z&quot;&gt;&lt;/path&gt;&#x27;;
        }

        const data = themeData[theme];
        root.querySelector(&#x27;#dg-theme-silhouette&#x27;).textContent = data.silhouette;
        root.querySelector(&#x27;#dg-theme-floor&#x27;).textContent = data.floor;
        root.querySelector(&#x27;#dg-theme-walls&#x27;).textContent = data.walls;
        root.querySelector(&#x27;#dg-theme-landmarks&#x27;).textContent = data.landmarks;
        root.querySelector(&#x27;#dg-theme-rule&#x27;).textContent = data.rule;
        root.querySelector(&#x27;#dg-theme-mechanics&#x27;).textContent = data.mechanics;
      }

      Object.entries(templateData).forEach(([value, data]) =&gt; {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = value;
        option.textContent = data.name;
        templateSelect.appendChild(option);
      });

      roomRange.addEventListener(&#x27;input&#x27;, () =&gt; roomValue.textContent = roomRange.value);
      loopRange.addEventListener(&#x27;input&#x27;, () =&gt; loopValue.textContent = loopRange.value);
      generateButton.addEventListener(&#x27;click&#x27;, renderPlan);
      inspectSelect.addEventListener(&#x27;change&#x27;, updateRoomSelection);
      templateSelect.addEventListener(&#x27;change&#x27;, renderTemplate);
      themeSelect.addEventListener(&#x27;change&#x27;, () =&gt; { renderThemeMarks(); renderTemplate(); });
      searchInput.addEventListener(&#x27;input&#x27;, () =&gt; searchInput.setCustomValidity(&#x27;&#x27;));
      searchForm.addEventListener(&#x27;submit&#x27;, event =&gt; {
        event.preventDefault();
        const query = searchInput.value.trim().toLowerCase();
        if (!query) return;
        const headings = [...root.querySelectorAll(&#x27;.wiki-article h1, .wiki-article h2, .wiki-article h3&#x27;)];
        const match = headings.find(heading =&gt; heading.textContent.toLowerCase().includes(query));
        if (!match) {
          searchInput.setCustomValidity(&#x27;No matching article section was found.&#x27;);
          searchInput.reportValidity();
          return;
        }
        searchInput.setCustomValidity(&#x27;&#x27;);
        match.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
      });
      roomLayer.addEventListener(&#x27;click&#x27;, event =&gt; {
        const group = event.target.closest(&#x27;[data-room-id]&#x27;);
        if (!group) return;
        selectedRoomId = Number.parseInt(group.dataset.roomId, 10);
        inspectSelect.value = String(selectedRoomId);
        updateRoomSelection();
      });
      discussButton.addEventListener(&#x27;click&#x27;, async () =&gt; {
        const theme = themeData[themeSelect.value];
        const template = templateData[templateSelect.value];
        const prompt = `Let us iterate on the dungeon generation design before implementation. Current visual selections: theme = ${theme.name}; room template = ${template.name}; illustrative room count = ${roomRange.value}; loop ceiling = ${loopRange.value}. Please discuss how this direction should change the art language, room grammar, gameplay readability, encounter design, and data model. Do not implement changes until we agree on the direction.`;
        let copied = false;
        try {
          await navigator.clipboard.writeText(prompt);
          copied = true;
        } catch (error) {
          const temporary = document.createElement(&#x27;textarea&#x27;);
          temporary.value = prompt;
          temporary.setAttribute(&#x27;readonly&#x27;, &#x27;&#x27;);
          temporary.style.position = &#x27;absolute&#x27;;
          temporary.style.left = &#x27;-9999px&#x27;;
          root.appendChild(temporary);
          temporary.select();
          copied = document.execCommand(&#x27;copy&#x27;);
          temporary.remove();
        }
        discussStatus.textContent = copied
          ? &#x27;Change brief copied. Paste it into your Codex task.&#x27;
          : prompt;
      });

      templateSelect.value = &#x27;OpenArena&#x27;;
      root.dataset.theme = &#x27;damp&#x27;;
      renderPlan();
      renderThemeMarks();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;

&lt;/body&gt;
